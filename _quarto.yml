project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "tracks/*.qmd"
  resources:
    - robots.txt
    - slides/
    - demo-materials/
    - interactive/
    - .nojekyll

website:
  title: "AI Workshops for DSPH"
  description: "Hands-on AI workshops for Dornsife School of Public Health faculty, staff, and graduate students"
  navbar:
    background: "#003366"
    foreground: white
    left:
      - href: index.qmd
        text: Home
      - text: "Core Sessions"
        menu:
          - href: workshop1.qmd
            text: "Core 1 · Foundations & Capabilities"
          - href: workshop2.qmd
            text: "Core 2 · Workflow Enhancement"
          - href: workshop3.qmd
            text: "Core 3 · Reusable Assistants"
          - href: workshop5.qmd
            text: "Core 4 · Verify, Disclose, Decide"
      - text: "Electives"
        menu:
          - href: workshop4.qmd
            text: "Documents & Visuals (Adobe)"
          - href: workshop6.qmd
            text: "AI for Curriculum Development"
      - href: tracks.qmd
        text: "Self-Paced Tracks"
      - href: paths.qmd
        text: "Learning Paths"
      - href: tools.qmd
        text: "Tools & Access"
      - href: resources.qmd
        text: Resources
    right:
      - icon: envelope
        href: mailto:daq26@drexel.edu
  page-footer:
    left: "AI Workshops for DSPH | Dornsife School of Public Health | Drexel University"
    right: "Developed with the assistance of Claude (Anthropic); reviewed and owned by the author. Built with Quarto."
    background: "#003366"

format:
  html:
    theme:
      light: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow">
        <script data-goatcounter="https://aquistbe.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
    include-after-body: _tracks-quiz.html
